<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Disco')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="contenedor estrecho">
    <h1 th:text="${discoForm.codigo == null} ? 'Nuevo disco' : ('Editar disco ' + ${discoForm.codigo})">
        Disco
    </h1>

    <form th:action="@{/discos/guardar}" th:object="${discoForm}" method="post" class="formulario" novalidate>

        <input type="hidden" th:field="*{codigo}">

        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'invalido'">
            <div class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
        </div>

        <div class="campo">
            <label for="precio">Precio (€)</label>
            <input type="number" step="0.01" th:field="*{precio}" th:classappend="${#fields.hasErrors('precio')} ? 'invalido'">
            <div class="error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}">Error</div>
        </div>

        <div class="campo">
            <label for="codigoGenero">Género</label>
            <select th:field="*{codigoGenero}" th:classappend="${#fields.hasErrors('codigoGenero')} ? 'invalido'">
                <option value="">-- Selecciona un género --</option>
                <option th:each="g : ${generos}" th:value="${g.codigo}" th:text="${g.nombre}">Género</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('codigoGenero')}" th:errors="*{codigoGenero}">Error</div>
        </div>

        <div class="acciones">
            <button type="submit" class="boton azul">Guardar</button>
            <a th:href="@{/discos}" class="boton gris">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
